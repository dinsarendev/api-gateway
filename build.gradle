plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.1.0.6387"
}

group = 'com.cambofreelance'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url "${findProperty('NEXUS_URL') ?: System.getenv('NEXUS_URL')}/repository/maven-public/"
        credentials {
            username = findProperty('NEXUS_USERNAME') ?: System.getenv('NEXUS_USERNAME')
            password = findProperty('NEXUS_PASSWORD') ?: System.getenv('NEXUS_PASSWORD')
        }
    }
}

ext {
    set('springCloudVersion', "2024.0.1")
}

sonar {
    properties {
        property "sonar.projectKey", "API-GATEWAY"
        property "sonar.projectName", "API GATEWAY"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
//    implementation 'io.opentelemetry:opentelemetry-sdk'
//    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
//    implementation "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"
    implementation "io.micrometer:micrometer-registry-prometheus"
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'commons-codec:commons-codec:1.15'
    implementation("org.springframework.boot:spring-boot-starter-data-redis-reactive")
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation("org.mindrot:jbcrypt:0.4")
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom  "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.16.0"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Frontend (React + Vite) ─────────────────────────────────────────────────
def frontendDir = "$projectDir/frontend"
def isWindows   = org.gradle.internal.os.OperatingSystem.current().isWindows()

task npmInstall(type: Exec) {
    description = 'Install frontend dependencies'
    workingDir  frontendDir
    inputs.file  "$frontendDir/package.json"
    outputs.dir  "$frontendDir/node_modules"
    // Use a login shell on Unix so nvm/Homebrew npm is on PATH in the Gradle daemon
    if (isWindows) {
        commandLine 'cmd', '/c', 'npm', 'install', '--prefer-offline'
    } else {
        commandLine 'bash', '-lc', 'npm install --prefer-offline'
    }
}

task npmBuild(type: Exec, dependsOn: npmInstall) {
    description = 'Build React frontend into src/main/resources/static'
    workingDir  frontendDir
    inputs.dir  "$frontendDir/src"
    inputs.file "$frontendDir/vite.config.js"
    outputs.dir "$projectDir/src/main/resources/static"
    if (isWindows) {
        commandLine 'cmd', '/c', 'npm', 'run', 'build'
    } else {
        commandLine 'bash', '-lc', 'npm run build'
    }
}

processResources.dependsOn npmBuild