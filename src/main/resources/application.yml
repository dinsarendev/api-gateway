spring:
  config:
    import: "optional:configserver:http://localhost:8085/"
  application:
    name: api-gateway
  profiles:
    active: dev
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@cambofreelance.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        gateway.request.duration: true
      percentiles:
        gateway.request.duration: 0.5,0.95,0.99

monitoring:
  abuse:
    threshold-per-minute: 100

incident:
  detection:
    enabled: true
    window-minutes: 5
    interval-ms: 60000
    initial-delay-ms: 60000
    error-rate-threshold: 0.10
    auth-failure-threshold: 0.15
    timeout-rate-threshold: 0.05
    p95-latency-threshold-ms: 2000
    api-down-error-rate: 0.95
    api-down-min-requests: 10
    cpu-threshold: 0.80
    memory-threshold: 0.85

health-check:
  interval-ms: 30000
  initial-delay-ms: 15000
