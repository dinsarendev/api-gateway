kind: Deployment
apiVersion: apps/v1
metadata:
  name: gateway-dashboard
  namespace: ms-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      component: gateway-dashboard
  template:
    metadata:
      labels:
        component: gateway-dashboard
    spec:
      containers:
        - name: gateway-dashboard
          image: >-
            nexus.cambofreelance.com/docker-hosted/ms/dev/gateway-dashboard:v1.0.0
          imagePullPolicy: IfNotPresent
      imagePullSecrets:
        - name: nexus-registry
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - infra-node-kdv5b
      tolerations:
        - key: dedicated
          operator: Equal
          value: stage
          effect: NoSchedule
        - key: infra-node
          operator: Exists
          effect: NoSchedule
  strategy:
    type: Recreate